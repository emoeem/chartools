name: capture_android
description: Android 采集层插件 —— 无障碍服务读屏 + 截屏 OCR，产 ChatSnapshot；回填只填输入框，从不发送。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  # 快照类型（Msg / ChatSnapshot / Provenance）来自共享领域包。
  chartools_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.chartools.capture_android
        pluginClass: CaptureAndroidPlugin
