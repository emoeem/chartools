name: CI

# ubuntu：静态检查 + core 纯 Dart 测试 + 插件/app 测试 + Android 能真正编译；
# windows：桌面端能真正编译。
# 注意：CI 跑在 GitHub 托管机上，网络直连官方源即可——不要配国内镜像变量
# （镜像给美国节点发的 zip 会截断损坏，windows job 已踩过坑）；
# flutter build 必须在 app/ 目录跑（workspace 根没有 android/ 与 lib/main.dart）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Workspace pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Core tests
        working-directory: packages/core
        run: dart test

      - name: Plugin tests
        working-directory: packages/capture_android
        run: flutter test

      - name: App tests
        working-directory: app
        run: flutter test

      - name: Build Android APK (debug)
        working-directory: app
        run: flutter build apk --debug

      # fix(#11 P0-2) 回归防线：release 合并 APK 必须含 INTERNET。debug 清单
      # （app/android/app/src/debug）自带 INTERNET，查 debug 包永远绿、挡不住
      # 主清单缺失——主清单漏权限的现场就是 release。release 无上传密钥时回退
      # debug 签名（见 app/android/app/build.gradle.kts），干净机器可构建；
      # --target-platform android-arm64 只出单 ABI，清单与 ABI 无关，为省 CI 时间。
      - name: Build Android APK (release, for manifest check)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Check merged APK declares INTERNET (fix #11 P0-2)
        working-directory: app
        run: |
          # 首选 build-tools 35.0.0（与 app/android/app/build.gradle.kts 的
          # buildToolsVersion 一致，上面的构建成功就说明它已就位）；若 AGP
          # 未来换 SDK 布局（如 build-tools 编号进版本目录），回退到
          # $ANDROID_HOME 下版本号最大的 aapt2，检查步骤不因路径形态漂移而失效。
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2="$(command -v aapt2 || true)"
          fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          fi
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "android.permission.INTERNET"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Workspace pub get
        run: dart pub get

      - name: Build Windows (debug)
        working-directory: app
        run: flutter build windows --debug
