name: CI

# ubuntu：静态检查 + core 纯 Dart 测试 + app widget 测试 + Android 能真正编译；
# windows：桌面端能真正编译。
# 镜像变量放在 job 级：flutter-action 拉取和 dart pub get 都走国内镜像。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Workspace pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Core tests
        working-directory: packages/core
        run: dart test

      - name: Plugin tests
        working-directory: packages/capture_android
        run: flutter test

      - name: App tests
        working-directory: app
        run: flutter test

      - name: Build Android APK (debug)
        run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Workspace pub get
        run: dart pub get

      - name: Build Windows (debug)
        run: flutter build windows --debug
