name: CI

# ubuntu：静态检查 + core 纯 Dart 测试 + 插件/app 测试 + Android 能真正编译；
# windows：桌面端能真正编译。
# 注意：CI 跑在 GitHub 托管机上，网络直连官方源即可——不要配国内镜像变量
# （镜像给美国节点发的 zip 会截断损坏，windows job 已踩过坑）；
# flutter build 必须在 app/ 目录跑（workspace 根没有 android/ 与 lib/main.dart）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Workspace pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Core tests
        working-directory: packages/core
        run: dart test

      - name: Plugin tests
        working-directory: packages/capture_android
        run: flutter test

      - name: App tests
        working-directory: app
        run: flutter test

      - name: Build Android APK (debug)
        working-directory: app
        run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Workspace pub get
        run: dart pub get

      - name: Build Windows (debug)
        working-directory: app
        run: flutter build windows --debug
