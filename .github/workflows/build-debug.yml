name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  domestic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cn
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run domestic app tests and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload domestic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-domestic-debug-apk
          path: cn/app/build/outputs/apk/debug/*.apk

  overseas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run WhatsApp app tests and build
        run: |
          chmod +x gradlew
          ./gradlew test :a11y:lintDebug :assistant:lintDebug :probe:lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload WhatsApp debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-whatsapp-debug-apk
          path: global/assistant/build/outputs/apk/debug/*.apk
