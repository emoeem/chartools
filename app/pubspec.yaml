name: chartools_app
description: 通用沟通助手的 Flutter 应用壳 —— UI 与平台集成都在这里；领域逻辑在 packages/core。
publish_to: 'none'
version: 2.0.0-alpha.1+1
resolution: workspace

# 工作区成员的 SDK 下界必须一致（pub workspace 规则），统一为 ^3.6.0。
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # 领域层：模型客户端、判断/起草流水线、人设/知识库、安全策略、场景模板。
  chartools_core:
    path: ../packages/core
  # Android 采集层：无障碍读屏 + OCR 产快照，回填只填输入框。
  capture_android:
    path: ../packages/capture_android
  # 设置持久化：JevConfig（key 字段除外）+ relationship + 悬浮窗开关等整包
  # 存成一个 JSON 字符串（见 lib/application/settings_store.dart）。
  # core 保持零第三方依赖，只有 app 用它。
  shared_preferences: ^2.5.0
  # API Key 安全区（p0-plan F2）：replyKey/judgeKey 迁出 shared_preferences
  # 明文，Android 走 Keystore、Windows 走 DPAPI。选 10.x：SDK 下界 >=3.3，
  # 与工作区统一声明的 ^3.6.0 兼容（11.x 要求 >=3.8.0）；app minSdk 30，
  # 高于插件要求的 23。
  flutter_secure_storage: ^10.3.4
  # Windows 全局热键（默认 Ctrl+Alt+C 唤起桌面助手页）的实现通道：纯 Dart FFI
  # 直调系统 user32.dll（RegisterHotKey + WM_HOTKEY 消息泵线程 + 切前台），
  # 不引入任何原生编译步骤。曾评估 hotkey_manager 0.3.0（sdk ^3.13.0 /
  # flutter >=3.47.0 与本机匹配），但其 Windows 实现经 nativeapi → cnativeapi
  # 走 native assets 构建链（cnativeapi 的 hook/build.dart 在构建期用
  # native_toolchain_c 编译 C++，本会话已核对源码），等价于给工作区第三次引入
  # 「本机工具链缺失即构建挂」的坑（见根 pubspec.yaml 两处钉版先例），且
  # analyze/test 门禁无法在不跑构建的前提下验证该 hook。win32 6.4.0 本就是
  # 锁内传递依赖（flutter_secure_storage_windows 通道），升直依零新增包。
  # 仅 Windows 代码路径使用，其它平台不 import 不调用。
  win32: ^6.4.0
  # win32 的配套：Arena/using（FindWindow 字符串的原生内存生命周期）与
  # String.toNativeUtf16。同为既有传递依赖升直依，零新增包。
  ffi: ^2.2.0
  # 应用级 KbStore 的存档目录（独立复核补接线）：Android/Linux 桌面的存档
  # 原落 TMPDIR/TEMP（进程 cache 目录，存储压力下系统可清——存档是用户数据
  # 的唯一真源，档丢即数据丢），改走 path_provider 的应用支持目录
  # （getApplicationSupportDirectory，应用私有且持久），main.dart 启动时对
  # 旧位置做一次性迁移。本就是锁内传递依赖（flutter_secure_storage 通道）
  # 升直依，零新增包；path_provider_android 由根 pubspec 钉在 2.2.23（无
  # jni/CMake 构建链，见根 pubspec dependency_overrides 注释）。
  path_provider: ^2.1.6
  # 文件选择器（专家页「从文件导入资产包」选 .json 用）：flutter.dev 第一方
  # 联邦插件，Windows/Android 等平台实现自带（本仓库不写平台代码）。约束写
  # ^1.1.0 而不是 ^2：2026-11 查证 pub.dev（pub.flutter-io.cn 同步）当前
  # stable 就是 1.1.0，不存在 2.x——1.1.0 要求 Dart ^3.9.0 / Flutter
  # >=3.35.0，本机 Dart 3.13.7 / Flutter 3.47.9 满足。经 pub.flutter-io.cn
  # 拉取，flutter pub get 由门禁统一跑。file_selector 只进 app，core 零第
  # 三方依赖的边界不变。
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
