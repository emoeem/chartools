# 本包（app）的测试运行器配置。
#
# concurrency 固定为 2（独立复核发现，宿主级缓解）：flutter test 为每个测试
# 文件起一个 flutter_tester.exe 进程，默认按 CPU 数并发（本机 16 个进程同时
# spawn），而 Flutter 3.47.x 的 Dart VM 采样分析器存在原生栈回溯竞态
# （flutter/flutter#191069），进程会随机 0xC0000005 崩溃——崩溃文件的在跑
# 测试被标 "did not complete"，套件随机红。压低并发可显著降低同时 spawn 的
# 资源争用面；全量 124 例在 -j 2 下实测稳定全绿（默认并发下约 1/3 的跑次
# 随机挂）。这是宿主级 flake 的缓解，不是对测试语义的放宽；零散的进程崩溃
# 由门禁的「失败即重跑」策略兜底（仅本机宿主，不进仓库 CI）。
concurrency: 2
